name: Deploy backend to VPS

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'deploy/vps/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.dockerignore'
      - 'eslint.config.mjs'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-production
  cancel-in-progress: false

jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  image:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    outputs:
      repo: ${{ steps.meta.outputs.repo }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: meta
        run: echo "repo=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pingpong-api" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile.x86-64-v1
          target: runtime
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.repo }}:release-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  deploy:
    needs: [checks, image]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Deploy over verified SSH
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_PORT: ${{ vars.VPS_PORT || '22' }}
          VPS_DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH }}
          DEPLOY_IMAGE_REPO: ${{ needs.image.outputs.repo }}
          DEPLOY_HEALTH_URL: ${{ vars.VPS_HEALTH_URL || 'https://pingpongapi.id.vn/api/v1/health/ready' }}
        run: |
          set -euo pipefail
          : "${VPS_HOST:?Set VPS_HOST secret}"
          : "${VPS_USER:?Set VPS_USER secret}"
          : "${VPS_SSH_KEY:?Set VPS_SSH_KEY secret}"
          : "${VPS_KNOWN_HOSTS:?Set VPS_KNOWN_HOSTS secret}"
          : "${VPS_DEPLOY_PATH:?Set VPS_DEPLOY_PATH variable}"
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$VPS_USER" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_-]*$ ]]
          [[ "$VPS_PORT" =~ ^[0-9]+$ ]]
          [[ "$VPS_DEPLOY_PATH" == /* ]]
          umask 077
          ssh_dir=$(mktemp -d)
          trap 'rm -f "$ssh_dir/key" "$ssh_dir/known_hosts"; rmdir "$ssh_dir"' EXIT
          printf '%s\n' "$VPS_SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          # Read the entire script before running commands that may consume stdin.
          printf -v remote_command 'cd -- %q && export DEPLOY_HEALTH_URL=%q DEPLOY_IMAGE_REPO=%q && deploy_script=$(cat) && bash -c "$deploy_script" -- %q' "$VPS_DEPLOY_PATH" "$DEPLOY_HEALTH_URL" "$DEPLOY_IMAGE_REPO" "$GITHUB_SHA"
          ssh -i "$ssh_dir/key" -p "$VPS_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "$VPS_USER@$VPS_HOST" "$remote_command" < deploy/vps/deploy.sh
