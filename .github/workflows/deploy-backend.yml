name: Deploy backend to VPS

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'deploy/vps/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.dockerignore'
      - 'eslint.config.mjs'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-production
  cancel-in-progress: false

jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck --workspace=@chat/api
      - run: npm run build --workspace=@chat/api
      - run: bash -n deploy/vps/deploy.sh

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Deploy over verified SSH
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_PORT: ${{ vars.VPS_PORT || '22' }}
          VPS_DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          : "${VPS_HOST:?Set VPS_HOST secret}"
          : "${VPS_USER:?Set VPS_USER secret}"
          : "${VPS_SSH_KEY:?Set VPS_SSH_KEY secret}"
          : "${VPS_KNOWN_HOSTS:?Set VPS_KNOWN_HOSTS secret}"
          : "${VPS_DEPLOY_PATH:?Set VPS_DEPLOY_PATH variable}"
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$VPS_USER" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_-]*$ ]]
          [[ "$VPS_PORT" =~ ^[0-9]+$ ]]
          [[ "$VPS_DEPLOY_PATH" == /* ]]
          umask 077
          ssh_dir=$(mktemp -d)
          trap 'rm -f "$ssh_dir/key" "$ssh_dir/known_hosts"; rmdir "$ssh_dir"' EXIT
          printf '%s\n' "$VPS_SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          # Read the entire script before running commands that may consume stdin.
          printf -v remote_command 'cd -- %q && deploy_script=$(cat) && bash -c "$deploy_script" -- %q' "$VPS_DEPLOY_PATH" "$GITHUB_SHA"
          ssh -i "$ssh_dir/key" -p "$VPS_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "$VPS_USER@$VPS_HOST" "$remote_command" < deploy/vps/deploy.sh
