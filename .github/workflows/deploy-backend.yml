name: Backend checks and VPS deployment

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      deploy: ${{ steps.scope.outputs.deploy }}
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: LocalTestOnly_42
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P LocalTestOnly_42 -Q 'SELECT 1' -b"
          --health-interval 5s --health-timeout 5s --health-retries 30
        ports:
          - 1433/tcp
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && '0' || '1' }}
      - name: Check whether to deploy the backend
        id: scope
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          deploy=true
          # Manual runs and pushes without a reachable base deploy after checks.
          if [[ -n "$BEFORE" ]] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            if git diff --quiet "$BEFORE" "$GITHUB_SHA" -- apps/api/ deploy/vps/ packages/ package.json package-lock.json .dockerignore eslint.config.mjs .github/workflows/deploy-backend.yml; then
              deploy=false
            else
              status=$?
              [[ "$status" == 1 ]] || exit "$status"
            fi
          fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify SQL Server migration and workspace integration
        env:
          DATABASE_URL: mssql://sa:LocalTestOnly_42@127.0.0.1:${{ job.services.sqlserver.ports['1433'] }}/pingpong_ci?encrypt=true&trustServerCertificate=true
          SQL_CONTAINER: ${{ job.services.sqlserver.id }}
        run: |
          docker exec "$SQL_CONTAINER" /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P LocalTestOnly_42 -b -Q 'CREATE DATABASE pingpong_ci'
          node apps/api/dist/modules/database/migrate.js --allow=SqlServerFoundation1790985600000
          node apps/api/dist/modules/database/migrate.js --check
          WORKSPACE_TEST_DATABASE_URL="$DATABASE_URL" node --test apps/api/tests/workspace.integration.cjs
      - name: Verify every new migration is reviewed
        run: bash deploy/vps/tests/migration-review.sh
      - name: Validate Blue-Green script syntax
        run: bash -n deploy/vps/deploy.sh && bash -n deploy/vps/switch-upstream.sh && bash -n deploy/vps/rollback.sh
      - name: Verify fail-closed migration, health and traffic switching
        run: bash deploy/vps/tests/deploy-failure.sh
      - name: Verify actual Nginx switching and failed-reload recovery
        shell: bash
        run: |
          set -euo pipefail
          printf 'FROM nginx:stable-alpine\nRUN apk add --no-cache bash flock curl\n' | docker build -t pingpong-nginx-test:validation -
          docker run --rm --network none \
            --mount "type=bind,source=$PWD/deploy/vps,target=/fixtures,readonly" \
            --entrypoint bash pingpong-nginx-test:validation /fixtures/tests/nginx-switch.integration.sh

  image:
    needs: checks
    if: needs.checks.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    outputs:
      repo: ${{ steps.meta.outputs.repo }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: meta
        run: echo "repo=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pingpong-api" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile.x86-64-v1
          target: runtime
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.repo }}:release-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  deploy:
    needs: [checks, image]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: backend-production
      cancel-in-progress: false
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Deploy over verified SSH
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_PORT: ${{ vars.VPS_PORT || '22' }}
          VPS_DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH }}
          DEPLOY_IMAGE_REPO: ${{ needs.image.outputs.repo }}
          DEPLOY_HEALTH_URL: ${{ vars.VPS_HEALTH_URL || 'https://pingpongapi.id.vn/api/v1/health/ready' }}
        run: |
          set -euo pipefail
          : "${VPS_HOST:?Set VPS_HOST secret}"
          : "${VPS_USER:?Set VPS_USER secret}"
          : "${VPS_SSH_KEY:?Set VPS_SSH_KEY secret}"
          : "${VPS_KNOWN_HOSTS:?Set VPS_KNOWN_HOSTS secret}"
          : "${VPS_DEPLOY_PATH:?Set VPS_DEPLOY_PATH variable}"
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$VPS_USER" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_-]*$ ]]
          [[ "$VPS_PORT" =~ ^[0-9]+$ ]]
          [[ "$VPS_DEPLOY_PATH" == /* ]]
          umask 077
          ssh_dir=$(mktemp -d)
          trap 'rm -f "$ssh_dir/key" "$ssh_dir/known_hosts"; rmdir "$ssh_dir"' EXIT
          printf '%s\n' "$VPS_SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          # Read the entire script before running commands that may consume stdin.
          printf -v remote_command 'cd -- %q && export DEPLOY_HEALTH_URL=%q DEPLOY_IMAGE_REPO=%q && deploy_script=$(cat) && bash -c "$deploy_script" -- %q' "$VPS_DEPLOY_PATH" "$DEPLOY_HEALTH_URL" "$DEPLOY_IMAGE_REPO" "$GITHUB_SHA"
          ssh -i "$ssh_dir/key" -p "$VPS_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "$VPS_USER@$VPS_HOST" "$remote_command" < deploy/vps/deploy.sh
