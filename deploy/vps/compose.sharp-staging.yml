# Standalone project. Never combine this file with production compose.yml.
name: pingpong-sharp-staging
x-api: &api
  image: ${SHARP_TEST_IMAGE:?Set SHARP_TEST_IMAGE to the verified local image ID}
  pull_policy: never
  init: true
  read_only: true
  tmpfs: ['/tmp:size=32m,mode=1777']
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  mem_limit: 384m
  cpus: 0.5
  networks: [staging]
  environment:
    NODE_ENV: test
    HOST: 0.0.0.0
    PORT: '3000'
    WEB_ORIGIN: http://localhost:5173
    JWT_ACCESS_SECRET: ${STAGING_JWT_SECRET:?Generate a separate staging JWT secret}
    DATABASE_URL: mssql://sa:${STAGING_DB_PASSWORD:?Generate a staging password}@staging-db:1433/pingpong_staging?encrypt=true&trustServerCertificate=true
    DATABASE_DIRECT_URL: mssql://sa:${STAGING_DB_PASSWORD:?Generate a staging password}@staging-db:1433/pingpong_staging?encrypt=true&trustServerCertificate=true
    CHAT_FILES_DIR: /app/storage/chat
  logging:
    driver: json-file
    options: { max-size: 5m, max-file: '2' }
services:
  staging-db:
    image: ${STAGING_SQLSERVER_IMAGE:?Set to the local SQL Server 2022 image ID}
    pull_policy: never
    mem_limit: 3g
    cpus: 1
    shm_size: 64m
    networks: [staging]
    environment:
      ACCEPT_EULA: Y
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${STAGING_DB_PASSWORD:?Generate a staging password}
      TZ: UTC
    volumes: [staging_sqlserver:/var/opt/mssql]
    healthcheck:
      test:
        [
          CMD-SHELL,
          'SQLCMDPASSWORD="$${MSSQL_SA_PASSWORD}" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q "SELECT 1"',
        ]
      interval: 5s
      timeout: 3s
      start_period: 45s
      retries: 18
    restart: 'no'
  staging-migrate:
    <<: *api
    command: [node, apps/api/dist/modules/database/migrate.js]
    restart: 'no'
    depends_on:
      staging-db: { condition: service_healthy }
  staging-api:
    <<: *api
    # Internal-only networks do not publish host ports on Docker Engine 29.
    # A separate staging bridge enables loopback HTTP without exposing the DB.
    networks: [staging, staging-http]
    restart: 'no'
    volumes: [staging_chat:/app/storage/chat]
    ports: ['127.0.0.1:3100:3000']
    depends_on:
      staging-db: { condition: service_healthy }
      staging-migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/api/v1/health/ready', {signal: AbortSignal.timeout(5000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 6s
      start_period: 30s
      retries: 6
networks:
  staging:
    internal: true
  staging-http:
volumes:
  staging_sqlserver:
  staging_chat:
