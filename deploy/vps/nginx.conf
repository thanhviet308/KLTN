# Install as /etc/nginx/sites-available/pingpong-api (inside nginx's http context).
# Replace pingpongapi.id.vn with your API domain, then let Certbot configure TLS.
map $http_upgrade $pingpong_connection_upgrade {
    default upgrade;
    '' close;
}

limit_req_zone $binary_remote_addr zone=pingpong_requests:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=pingpong_handshakes:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name pingpongapi.id.vn;
    server_tokens off;
    client_max_body_size 10m;
    limit_req_status 429;

    # Omit query strings: clients must never send credentials in a URL.
    access_log off;

    location /api/v1/ {
        limit_req zone=pingpong_requests burst=30 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite client-supplied forwarding headers; backend trusts one hop.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # /chat is a Socket.IO namespace; the network request path is /socket.io/.
    location /socket.io/ {
        limit_req zone=pingpong_handshakes burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $pingpong_connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering off;
    }

    location / {
        return 404;
    }
}
