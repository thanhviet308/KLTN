# Install as /etc/nginx/sites-available/pingpong-api (inside nginx's http context).
# Replace pingpongapi.id.vn with your API domain, then let Certbot configure TLS.
map $http_upgrade $pingpong_connection_upgrade {
    default upgrade;
    '' close;
}

map $request_method $pingpong_request_key {
    default $binary_remote_addr;
    OPTIONS "";
}
limit_req_zone $pingpong_request_key zone=pingpong_requests:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=pingpong_handshakes:10m rate=5r/s;

map $http_origin $pingpong_cors_origin {
    default "";
    "https://www.pingpong.id.vn" "https://www.pingpong.id.vn";
}

server {
    listen 80;
    listen [::]:80;
    server_name pingpongapi.id.vn;
    server_tokens off;
    client_max_body_size 10m;
    limit_req_status 429;
    error_page 429 = @rate_limited;

    # Nginx rejects these before Nest can attach its CORS headers.
    location @rate_limited {
        default_type application/json;
        add_header Access-Control-Allow-Origin $pingpong_cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Expose-Headers "Retry-After" always;
        add_header Vary "Origin" always;
        add_header Retry-After "5" always;
        add_header Cache-Control "no-store" always;
        return 429 '{"code":"RATE_LIMITED","message":"Too many requests"}';
    }

    # Omit query strings: clients must never send credentials in a URL.
    access_log off;

    location /api/v1/ {
        limit_req zone=pingpong_requests burst=30 nodelay;
        proxy_pass http://pingpong_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite client-supplied forwarding headers; backend trusts one hop.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # /chat is a Socket.IO namespace; the network request path is /socket.io/.
    location /socket.io/ {
        limit_req zone=pingpong_handshakes burst=10 nodelay;
        proxy_pass http://pingpong_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $pingpong_connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering off;
    }

    location / {
        return 404;
    }
}
