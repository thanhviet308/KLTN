name: pingpong-backend

x-runtime: &runtime
  image: pingpong-api:local
  env_file:
    - path: .env
      format: raw
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  mem_limit: 1g
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'

services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    env_file:
      - path: postgres.env
        format: raw
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-app.sh:ro
    shm_size: 128m
    mem_limit: 1g
    stop_grace_period: 60s
    healthcheck:
      test:
        [
          CMD-SHELL,
          'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"',
        ]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  api:
    <<: *runtime
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      CHAT_FILES_DIR: /app/storage/chat
    volumes:
      - chat_files:/app/storage/chat
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - '127.0.0.1:3000:3000'
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/v1/health/ready', {signal: AbortSignal.timeout(5000)}).then(r => { console.log('readiness HTTP ' + r.status); process.exit(r.ok ? 0 : 1); }).catch(e => { console.error('readiness request failed: ' + (e.cause?.code || e.name)); process.exit(1); })"
      interval: 30s
      timeout: 6s
      start_period: 45s
      retries: 3

  migrate:
    <<: *runtime
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'
    command: [node, apps/api/dist/modules/database/migrate.js]

volumes:
  postgres_data:
  chat_files:
