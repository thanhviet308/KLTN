name: pingpong-backend

x-runtime: &runtime
  image: ${BACKEND_IMAGE:-pingpong-api:local}
  pull_policy: never
  env_file:
    - path: .env
      format: raw
  extra_hosts:
    - host.docker.internal:host-gateway
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  mem_limit: 1g
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'

services:
  api: &api
    <<: *runtime
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile.x86-64-v1
      target: runtime
      platforms: [linux/amd64]
    restart: unless-stopped
    mem_limit: 512m
    environment:
      CHAT_FILES_DIR: /app/storage/chat
      DEPLOYMENT_REVISION: ${DEPLOYMENT_REVISION:-}
    volumes:
      - chat_files:/app/storage/chat
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - '127.0.0.1:3000:3000'
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/v1/health/ready', {signal: AbortSignal.timeout(5000)}).then(r => { console.log('readiness HTTP ' + r.status); process.exit(r.ok ? 0 : 1); }).catch(e => { console.error('readiness request failed: ' + (e.cause?.code || e.name)); process.exit(1); })"
      interval: 30s
      timeout: 6s
      start_period: 45s
      retries: 3

  api-green:
    <<: *api
    profiles: [blue-green]
    ports:
      - '127.0.0.1:3001:3000'

  migrate:
    <<: *runtime
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile.x86-64-v1
      target: runtime
      platforms: [linux/amd64]
    restart: 'no'
    command: [node, apps/api/dist/modules/database/migrate.js]

volumes:
  chat_files:
